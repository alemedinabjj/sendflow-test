name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            functions/package-lock.json
            rules-tests/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - run: npm install -g firebase-tools
      - run: npm ci --prefix web
      - run: npm ci --prefix functions
      - run: npm ci --prefix rules-tests

      - name: Web lint, tests and build
        run: |
          npm --prefix web run lint
          npm --prefix web test
          npm --prefix web run build

      - name: Functions build
        run: npm --prefix functions run build

      - name: Security rules and functions tests (emulator)
        run: >
          firebase emulators:exec --only firestore --project demo-sendflow
          "npm --prefix rules-tests test && npm --prefix functions test"

